id: roles:role-product-owner
type: Role
name: Product Owner
description: >-
  Maximizes the value of one product. Owns and prioritizes the product
  backlog, accepts increments against acceptance criteria, and is the single
  accountable decision point for product scope within the domain's guardrails.
version: 0.1.0
lifecycle_status: proposed
tags:
  - functional
  - product
