    source_id: roles:role-product-owner
    target_id: skills:skill-product-management
    relationship_type: requires
    status: proposed
    rationale: >-
      The role cannot be fulfilled without product management competency
      (SKL -> ROL "required by", OpenDEAM v0.3.0).
    provenance:
      type: manual
      asserted_by: catalog-seed
      verification_status: unverified
