id: roles:role-regulatory-compliance-manager
type: Role
name: Regulatory Compliance Manager
description: >-
  Accountable for the enterprise's compliance with sector regulation:
  interprets regulatory obligations for the operating model, owns the
  compliance control evidence, and is the escalation point for regulators.
version: 0.2.0
lifecycle_status: active
tags:
  - governance
  - compliance
metadata:
  catalog: technehub-labs/dea-catalog-roles
  metamodel_version: v0.3.0
  industries:
    - telecom
    - banking
    - health
    - public-sector
  evidence_rating: E5
  evidence_ladder:
    - stage: E1-recurrence
      date: '2026-10-27'
      reference: industries/telecom.yaml
    - stage: E2-corroboration
      date: '2026-10-27'
      reference: industries/banking.yaml
    - stage: E3-enterprise-generality
      date: '2026-10-27'
      reference: industries/health.yaml (+ public-sector)
    - stage: E4-distinctness
      date: '2026-10-27'
      reference: docs/distinctness-register.md
    - stage: E5-review
      date: '2026-10-27'
      reference: change-requests/CR-DEA-ROL-02-first-canonical-admission.md
relationships:
  - id: roles:rel-rcm-requires-rcm-skill
    source_id: roles:role-regulatory-compliance-manager
    target_id: skills:skill-regulatory-compliance
    relationship_type: requires
    status: proposed
    rationale: >-
      The role cannot be fulfilled without regulatory compliance competency
      (SKL -> ROL "required by", OpenDEAM v0.3.0). Telco discovery pass 1;
      recurs across regulated industries (telecom, finance, health).
      Banking pass corroborates: E2 (two independent industries). Health
      pass adds a third regulated industry: enterprise-generality argument
      recorded at E3. Public-sector pass adds a fourth: regulation
      administration corroborated from the regulator side.
    provenance:
      type: manual
      asserted_by: catalog-seed
      verification_status: unverified
evidence:
  sources:
    - industries/telecom.yaml
    - industries/banking.yaml
    - industries/health.yaml
    - industries/public-sector.yaml
  rationale: >-
    Admitted canonical (E5) via CR-DEA-ROL-02: four-industry recurrence,
    distinct from all adjacent compliance/assurance roles per the
    distinctness register.
